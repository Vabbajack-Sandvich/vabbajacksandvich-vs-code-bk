//r_cheapwaterstart 1
r_cheapwaterstart 5000
r_cheapwaterend 5000
//r_WaterDrawRefraction 1
r_WaterDrawRefraction 1
r_waterforceexpensive 1
//might have to change this
cl_predictweapons 1

