cl_pred_optimize 2
cl_smooth 0
//cl_smoothtime 0.01
cl_smoothtime 0
cl_showerror 0
cl_lagcompensation 1
//tf_healthicon_height_offset -10
tf_healthicon_height_offset -5

//potential reload command
//disconnect; exec custom; retry

//net_splitpacket_maxrate 80000
//too high got booted
//net_splitpacket_maxrate 1048576
//net_splitpacket_maxrate 128000
//net_splitpacket_maxrate 128000

//was decent
//net_splitpacket_maxrate 40000
//net_splitrate 4

//def 80000
//min 1000
//max 1048576
//Max bytes per second when queueing splitpacket chunks
net_splitpacket_maxrate 131072

//Number of fragments for a splitpacket
//that can be sent per frame
//def 1
net_splitrate 1
net_showsplits 0
//Use a high priority thread to send
//queued packets out instead of sending them each frame
net_queued_packet_thread 1
//def 1
net_compresspackets 1
//def 4.0
//Max # of seconds we can wait for next packets to
//be sent based on rate setting (0 == no limit).
net_maxcleartime 0.1
//def 1260
//min 576
//max 1260
//Requested max packet size before packets are 'split'.
net_maxroutable 1260
//min 8192
//max 131072
net_udp_rcvbuf 131072

//def is 5000
//0 is unlimited
net_maxpacketdrop 5000

//video and memory
fps_max 60
mat_phong 1
mat_motion_blur_enabled 0
//The queue/thread mode the material system should use:
//-1=default, 0=synchronous single thread, 2=queued multithreaded
mat_queue_mode 2
mat_postprocessing_combine 0
//mat_monitorgamma 1.6
mat_monitorgamma 1.7
//mat_monitorgamma 1.9

lzma_persistent_buffer 1
//8192 is 8 gigs
mem_max_heapsize 4096
mem_min_heapsize 2048
datacachesize 512

//sound voice
// ( def. "1.0" )"volume" = "0.230000" min. 0.000000 max. 1.000000
//volume .15
volume .12
voice_enable 0
snd_mute_losefocus 0

//gameplay
hud_fastswitch 1
sensitivity 6.5
mp_decals 0
r_decals 0
hud_saytext_time 0
cl_showtextmsg 0
cl_notifications_show_ingame 0
tf_scoreboard_mouse_mode 2
cl_autoreload 1
cl_allowdownload 1
cl_autorezoom 1
cl_disablehtmlmotd 1
cl_downloadfilter all
cl_mute_all_comms 1
tf_remember_activeweapon 1
tf_remember_lastswitched 0
//fixes hud caching erros
vgui_cache_res_files 0

